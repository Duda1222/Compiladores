<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compilador Educacional</title>
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>
  <header class="topo">
    <div>
      <h1>Compilador Educacional</h1>
      <p class="topo__sub">Análise léxica e sintática passo a passo para estudantes de Computação</p>
    </div>
    <p class="selo" id="linguagem">Linguagem analisada: <strong>Python</strong> (subconjunto)</p>
  </header>

  <main class="layout">
    <section class="cartao" aria-labelledby="titulo-entrada">
      <h2 id="titulo-entrada">Código-fonte</h2>

      <div class="linha-exemplos">
        <label for="exemplos">Exemplos</label>
        <select id="exemplos">
          <option value="">Selecione um exemplo…</option>
        </select>
        <button type="button" id="btn-limpar" class="botao botao--secundario">Limpar</button>
      </div>
      <p id="descricao-exemplo" class="descricao" aria-live="polite"></p>

      <label for="codigo" class="rotulo-editor">Escreva, cole ou edite um programa:</label>
      <textarea
        id="codigo"
        spellcheck="false"
        autocomplete="off"
        autocapitalize="off"
        rows="14"
        placeholder="x = 10&#10;while x &gt; 0:&#10;    x = x - 1"
      >x = 10
while x &gt; 0:
    x = x - 1
</textarea>

      <button type="button" id="btn-analisar" class="botao">Analisar código</button>
    </section>

    <section class="cartao" id="resultados" aria-labelledby="titulo-resultados">
      <h2 id="titulo-resultados">Resultados</h2>
      <div id="resultado-conteudo" class="resultado resultado--vazio" aria-live="polite"></div>
    </section>
  </main>

  <footer class="rodape">
    <p>Compiladores · Trabalho 2 · Autora: Maria Eduarda Almeida Lopes</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
