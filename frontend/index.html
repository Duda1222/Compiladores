<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compilador Educacional</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f6fa;
      color: #222;
    }
    h1 { margin-bottom: 0.25rem; }
    #mensagem { font-size: 2rem; font-weight: 600; }
    #status { color: #666; margin-top: 0.5rem; }
    .erro { color: #b00020; }
  </style>
</head>
<body>
  <h1>Compilador Educacional</h1>
  <p>Análise léxica e sintática de um subconjunto de Python</p>
  <div id="mensagem">Carregando...</div>
  <div id="status"></div>

  <script>
    fetch("/api/hello")
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then((dados) => {
        document.getElementById("mensagem").textContent = dados.message;
        document.getElementById("status").textContent = "Resposta recebida do backend.";
      })
      .catch((e) => {
        const el = document.getElementById("mensagem");
        el.textContent = "Erro ao falar com o backend";
        el.className = "erro";
        document.getElementById("status").textContent = String(e);
      });
  </script>
</body>
</html>
